name: BrickShare CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests, PostgreSQL migrations and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brickshare_test
          # Disposable CI-only database credential, never used by a deployed service.
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: brickshare_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brickshare_test -d brickshare_api_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://brickshare_test:ci-disposable-only@127.0.0.1:5432/brickshare_api_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm run setup:api
      - run: npm ci
      - run: npm ci --prefix react-frontend
      - run: npm run compile
      - name: API and SIWE security unit tests
        run: npm run test:api
      - name: PostgreSQL migrations, authentication and tenant isolation tests
        run: npm run test:api:db
      - name: Real local-chain integration and HTTP wallet login
        run: npm run test:indexer:live
      - run: npm run build:api

  contracts:
    name: Contracts and deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:config
      - run: npm run compile
      - run: npm test
      - name: Check committed ABI is current
        run: git diff --exit-code -- react-frontend/src/generated/RealEstateTokenization.abi.json

  frontend:
    name: Frontend tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json
      - run: npm ci --prefix react-frontend
      - name: Frontend metadata, wallet session and transaction compatibility tests
        run: npm run test:frontend
      - run: npm run build
      - name: Validate hosted-testnet build path with public test configuration
        run: npm run build:testnet
        env:
          VITE_NETWORK: baseSepolia
          # Syntax-only fixture, never deployed or uploaded as a demo.
          VITE_CONTRACT_ADDRESS: "0x1111111111111111111111111111111111111111"
          VITE_DEPLOYMENT_BLOCK: "1"
          VITE_RPC_URL: https://sepolia.base.org
